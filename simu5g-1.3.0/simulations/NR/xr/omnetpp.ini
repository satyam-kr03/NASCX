#------------------------------------#
# Config XR-DL-Dataset
#
# Multi-user XR downlink for ML dataset generation
# Features:
# - Large deployment area (500m x 500m) for CQI diversity
# - Aggressive UE mobility (5-20 m/s)
# - Mix of near/far initial positions
# - PF scheduler with 5ms deadline
#------------------------------------#
[Config XR-DL-Dataset]
extends = NR-XR-Base

############### Larger Deployment Area ##################
# Override to 1200m x 1200m for greater distance variation and CQI diversity
**.mobility.constraintAreaMaxX = 1200m
**.mobility.constraintAreaMaxY = 1200m

############### gNB at center of larger area ##################
*.gnb.mobility.initialX = 600m
*.gnb.mobility.initialY = 600m

############### Channel Model Overrides ##################
# Enable shadowing for realistic CQI variation
**.channelModel.shadowing = true
**.channelModel.scenario = "URBAN_MACROCELL"

############### Scheduler ##################
**.gnb.cellularNic.mac.schedulingDisciplineDl = "PF"

############## UE configuration ##################
*.numUe = ${numUsers=2,3,4,5,6,7,8,9,10}

# Very aggressive Random Waypoint Mobility for CQI variation
*.ue[*].mobility.typename = "RandomWaypointMobility"
*.ue[*].mobility.speed = uniform(5mps, 40mps)  # Wide speed range
*.ue[*].mobility.waitTime = 0s  # No waiting, continuous movement

# NEAR users: ~50-100m from gNB center
*.ue[0].mobility.initialX = uniform(550m, 650m)
*.ue[0].mobility.initialY = uniform(550m, 650m)

# FAR users at CORNERS: ~600-800m from center
*.ue[1].mobility.initialX = uniform(20m, 120m)
*.ue[1].mobility.initialY = uniform(20m, 120m)
*.ue[2].mobility.initialX = uniform(1080m, 1180m)
*.ue[2].mobility.initialY = uniform(1080m, 1180m)
*.ue[4].mobility.initialX = uniform(20m, 120m)
*.ue[4].mobility.initialY = uniform(1080m, 1180m)
*.ue[5].mobility.initialX = uniform(1080m, 1180m)
*.ue[5].mobility.initialY = uniform(20m, 120m)

# MID-RANGE users: ~200-400m from center
*.ue[3].mobility.initialX = uniform(250m, 400m)
*.ue[3].mobility.initialY = uniform(550m, 700m)
*.ue[6].mobility.initialX = uniform(800m, 950m)
*.ue[6].mobility.initialY = uniform(400m, 550m)
*.ue[7].mobility.initialX = uniform(400m, 550m)
*.ue[7].mobility.initialY = uniform(150m, 300m)
*.ue[8].mobility.initialX = uniform(700m, 850m)
*.ue[8].mobility.initialY = uniform(850m, 1000m)
*.ue[9].mobility.initialX = uniform(200m, 350m)
*.ue[9].mobility.initialY = uniform(200m, 350m)

#============= Application Setup =============
# Server sends XR traffic to all UEs (downlink)
*.server.numApps = ${numUsers}

*.server.app[*].typename = "simu5g.apps.xr.XRTrafficSource"
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088 + ancestorIndex(0)
*.server.app[*].startTime = uniform(0s, 0.02s)
# fps is set per-user by generate_dataset.py script
# *.server.app[*].fps = 60
*.server.app[*].pcaFile = "traffic_files/pca_sweep_summary_scaled.csv"
*.server.app[*].compressionLevel = 0  # Will be set dynamically by script

# Jitter parameters
*.server.app[*].jitterMean = -4ms
*.server.app[*].jitterStd = 2ms
*.server.app[*].jitterMin = -4ms
*.server.app[*].jitterMax = 4ms
*.server.app[*].jitterSeed = ancestorIndex(0)

# UE receivers
*.ue[*].numApps = 1
*.ue[*].app[0].typename = "simu5g.apps.xr.XRTrafficReceiver"
*.ue[*].app[0].localPort = 3000
*.ue[*].app[0].deadlineMs = 10ms  # 5ms delay bound for dataset
*.ue[*].app[0].pcaFile = "traffic_files/pca_sweep_summary_scaled.csv"
# expectedFrames is set per-user by generate_dataset.py script (fps * sim-time)
# *.ue[*].app[0].expectedFrames = 1074


#------------------------------------#
# Config XR-DL-RandomCL
#
# Multi-user XR downlink with random per-frame compression level
# Each frame gets a randomly selected compression level from the PCA sweep
# Used for ML dataset generation with diverse compression patterns
#------------------------------------#
[Config XR-DL-RandomCL]
extends = NR-XR-Base

############### Larger Deployment Area ##################
