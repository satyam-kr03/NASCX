*.gnb.mobility.initialY = 600m

############### Channel Model Overrides ##################
# Enable shadowing for realistic CQI variation across distance/time
**.channelModel.shadowing = true
**.channelModel.scenario = "URBAN_MACROCELL"

############### Scheduler ##################
**.gnb.cellularNic.mac.schedulingDisciplineDl = "MAXCI"

############## UE configuration ##################
*.numUe = 10  # Max users (overridden by script per-run)

# Random Waypoint Mobility for CQI variation
*.ue[*].mobility.typename = "RandomWaypointMobility"
*.ue[*].mobility.speed = uniform(5mps, 40mps)
*.ue[*].mobility.waitTime = 0s

# NEAR users: ~50-100m from gNB (expect CQI 12-15)
